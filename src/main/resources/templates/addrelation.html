<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Ajouter une relation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
        }
        .form-control {
            width:484px;
            height:54px;
        }
        .add-button{
            width:151px;
            height:62px;
            background-color:#F69F1D;
            color:white;
        }
        .form-errors{
            color:red;
            font-style:italic;
            margin:auto;
            text-align:center;
        }
        .btn-orange{
            background-color:#F69F1D;
            color:white;
        }
        .btn-orange:hover{
            background-color:#F48F00;
            color:white;
        }
    </style>
</head>
<body class="">
<div th:replace="fragments/header :: header('addrelation')"></div>
<div class="d-flex justify-content-center align-items-center vh-100">
    <form method="post" th:action="@{/addrelation}" th:object="${userRelationDto}">
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex flex-column">
                <label class="form-label" for="email">Chercher une relation</label>
                <input
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Saisir une adresse mail"
                        required
                        th:field="*{email}"
                        type="email"
                />
                <p
                        class="form-errors"
                        th:errors="*{email}"
                        th:if="${#fields.hasErrors('email')}"
                ></p>
            </div>
            <button class="add-button btn btn-orange d-block mx-auto" type="submit">
                Ajouter
            </button>
        </div>
        <div class="mt-3 alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="mt-3 alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    </form>
</div>
</body>
</html>
