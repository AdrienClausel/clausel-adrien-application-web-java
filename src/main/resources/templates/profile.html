<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Ajouter une relation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
        }
        .form-control {
            width:277px;
            height:28px;
        }
        .form-errors{
            color:red;
            font-style:italic;
            margin:auto;
            text-align:center;
        }
        .btn-orange{
            background-color:#F69F1D;
            color:white;
            width:147px;
            height:64px;
        }
        .btn-orange:hover{
            background-color:#F48F00;
            color:white;
        }
    </style>
</head>
<body class="">
<div th:replace="fragments/header :: header('profile')"></div>
<div class="d-flex justify-content-center align-items-center vh-100">
    <form method="post" th:action="@{/changePassword}" th:object="${userProfileDto}">
        <div class="container">
            <div class="row">
                <div class="col-3 p-2">Username</div>
                <div class="col-6 p-2" th:text="*{username}"></div>
                <input th:field="*{username}" type="hidden">
                <div class="col-3 p-2"></div>
            </div>
            <div class="row">
                <div class="col-3 p-2">Mail</div>
                <div class="col-6 p-2" th:text="*{email}"></div>
                <input th:field="*{email}" type="hidden">
                <div class="col-3 p-2"></div>
            </div>
            <div class="row">
                <div class="col-3 p-2">Mot de passe</div>
                <div class="col-6 p-2">
                    <input
                            class="form-control"
                            name="password"
                            placeholder="Mot de passe"
                            required
                            th:field="*{password}"
                            type="password"
                    />
                </div>
                <div class="col-3 p-2">
                    <button class="btn btn-orange d-block mx-auto" type="submit">
                        Modifier
                    </button>
                </div>
            </div>
        </div>
        <div class="mt-3 alert alert-danger" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></div>
        <div class="mt-3 alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    </form>
</div>
</body>
</html>
