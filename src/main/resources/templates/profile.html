<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="fragments/head-common :: common-head('Profil')"></th:block>
    <style>
        .form-control {
            width:277px;
            height:28px;
        }
        .btn-orange{
            width:147px;
            height:64px;
        }
        .btn-orange:hover{
            background-color:#F48F00;
            color:white;
        }
        .form-control {
            font-size:20px;
            font-weight:400;
            color:#767676;
        }
    </style>
</head>
<body class="d-flex flex-column vh-100">
<div th:replace="fragments/header :: header('profile')"></div>
<main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <h1 class="visually-hidden">Profil</h1>
    <form method="post" th:action="@{/changePassword}" th:object="${userProfileDto}">
        <div class="container">
            <div class="row">
                <div class="col-3 p-2 text-bold">Username</div>
                <div class="col-6 p-2 text-regular" th:text="*{username}"></div>
                <input th:field="*{username}" type="hidden">
                <div class="col-3 p-2"></div>
            </div>
            <div class="row">
                <div class="col-3 p-2 text-bold">Mail</div>
                <div class="col-6 p-2 text-regular" th:text="*{email}"></div>
                <input th:field="*{email}" type="hidden">
                <div class="col-3 p-2"></div>
            </div>
            <div class="row">
                <div class="col-3 p-2 text-bold">Mot de passe</div>
                <div class="col-6 p-2">
                    <input
                            class="form-control"
                            name="password"
                            placeholder="Mot de passe"
                            required
                            th:field="*{password}"
                            type="password"
                    />
                </div>
                <div class="col-3 p-2">
                    <button class="btn btn-orange d-block mx-auto" type="submit">
                        Modifier
                    </button>
                </div>
            </div>
        </div>
        <div class="mt-3 alert alert-danger" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></div>
        <div class="mt-3 alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
