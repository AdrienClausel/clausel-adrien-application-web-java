<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
        }

        .form-select{
            width:399px;
            height:81px;
        }
        .input-description{
            width:382px;
            height:81px;
        }
        .input-amount{
            width:189px;
            height:121px;
        }
        .btn-paid{
            width:120px;
            height:88px;
        }
        .price-input-container {
            display: flex;
            align-items: center;
            border: var(--bs-border-width) solid var(--bs-border-color);
            border-radius:var(--bs-border-radius);
            padding:2px;
            width:189px;
            height:121px;
        }
        .price-input-container:focus-within {
            outline: 0;
            box-shadow:0 0 0 .25rem rgba(13,110,253,.25);
            border-color:#86b7fe;
        }
        .price-input {
            width: 150px;
            height: 60px;
            border: none;
            text-align: left;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .price-input:focus{
            outline:none;
        }
        .dropdown-arrows {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height:100px;
        }
        .arrow {
            font-size: 16px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }
        .form-errors{
            color:red;
            font-style:italic;
            margin:auto;
            text-align:center;
        }
    </style>
</head>
<body>

<div th:replace="fragments/header :: header('transfert')"></div>

<div class="container mt-4">

    <form class="d-flex gap-3 align-items-center" method="post" th:action="@{/transfert}"
          th:object="${transactionTransfertDto}">

        <div class="container mt-5 mb-5">
            <div class="row">
                <div class="col-4 p-2 d-flex justify-content-center align-items-center">
                    <div>
                        <select class="form-select" th:field="*{receiverId}">
                            <option value="">Sélectionner une relation</option>
                            <option th:each="u : ${relationUsers}"
                                    th:text="${u.username}"
                                    th:value="${u.id}">
                            </option>
                        </select>
                        <p
                                class="form-errors"
                                th:errors="*{receiverId}"
                                th:if="${#fields.hasErrors('receiverId')}"
                        ></p>
                    </div>
                </div>
                <div class="col-4 p-2 d-flex justify-content-center align-items-center">
                    <div>
                        <input
                                class="form-control input-description"
                                placeholder="Description"
                                th:field="*{description}"
                                type="text"
                        />
                        <p
                                class="form-errors"
                                th:errors="*{description}"
                                th:if="${#fields.hasErrors('description')}"
                        ></p>
                    </div>
                </div>
                <div class="col-2 p-2 d-flex justify-content-center align-items-center">
                    <div>
                        <div class="price-input-container form-control">
                            <input class="price-input" id="priceInput" maxlength="10" th:field="*{amount}" type="text"
                                   value="0€">
                            <div class="dropdown-arrows">
                                <span class="arrow" id="increment"><img th:src="@{/chevron-up.svg}"/></span>
                                <span class="arrow" id="decrement"><img th:src="@{/chevron-down.svg}"/></span>
                            </div>
                        </div>
                        <p
                                class="form-errors"
                                th:errors="*{amount}"
                                th:if="${#fields.hasErrors('amount')}"
                        ></p>
                    </div>
                </div>
                <div class="col-2 p-2 d-flex justify-content-center align-items-center">
                    <button class="btn btn-primary btn-paid" type="submit">Payer</button>
                </div>
            </div>
        </div>
    </form>

    <div class="mt-3 alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="container mt-4">
        <div class="p-4 border rounded-3">
            <div class="fw-semibold">Mes Transactions</div>
            <div class="row fw-semibold mb-2">
                <div class="col-4">Relations</div>
                <div class="col-4">Description</div>
                <div class="col-4 text-end">Montant</div>
            </div>
            <div class="row py-2 border-top" th:each="t : ${transactions}">
                <div class="col-4" th:text="${t.receiver.username}"></div>
                <div class="col-4" th:text="${t.description}"></div>
                <div class="col-4 text-end" th:text="${t.formatedAmount}"></div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const priceInput = document.getElementById('priceInput');
        const incrementBtn = document.getElementById('increment');
        const decrementBtn = document.getElementById('decrement');

        function formatValue(value) {
            return value + '€';
        }

        function extractValue(formattedValue) {
            return parseInt(formattedValue.replace('€', '').replace(/\D/g, ''), 10) || 0;
        }

        incrementBtn.addEventListener('click', () => {
            let currentValue = extractValue(priceInput.value);
            currentValue += 1;
            priceInput.value = formatValue(currentValue);
        });

        decrementBtn.addEventListener('click', () => {
            let currentValue = extractValue(priceInput.value);
            if (currentValue > 0) {
                currentValue -= 1;
                priceInput.value = formatValue(currentValue);
            }
        });

        priceInput.addEventListener('input', (e) => {
            let inputValue = e.target.value;
            let numericValue = inputValue.replace(/\D/g, '');
            e.target.value = numericValue + '€';
        });

        priceInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                return;
            }
            if (!/\d/.test(e.key)) {
                e.preventDefault();
            }
        });

        function enforceCursorPosition() {
            const value = priceInput.value;
            const euroIndex = value.indexOf('€');

            if (euroIndex !== -1) {
                // Si le curseur est après le €
                if (priceInput.selectionStart > euroIndex) {
                    priceInput.setSelectionRange(euroIndex, euroIndex);
                }
            }
        }

        priceInput.addEventListener('click', enforceCursorPosition);
        priceInput.addEventListener('keyup', enforceCursorPosition);
        priceInput.addEventListener('input', enforceCursorPosition);
</script>
</body>
</html>
