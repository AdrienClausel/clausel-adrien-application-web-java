<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="fragments/head-common :: common-head('Inscription')"></th:block>
    <style>
        .signup-button{
            width:159px;
            height:64px;
            margin:auto;
            margin-top:102px;
            background-color:#207FEE;
            color:white;
            font-weight:700;
            font-size:24px;
        }

        .input-username {
            margin-top:66px;
        }
        .input-email{
            margin-top:21px;
        }
        .input-password{
            margin-top:21px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">

<main class="center-frame">
    <h1 class="title-box">Pay My Buddy</h1>

    <form method="post" th:action="@{/signup}" th:object="${userSignUpDto}">
        <div class="input-username">
            <label class="visually-hidden" for="username">Nom d’utilisateur</label>
            <input
                    aria-describedby="username-error"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Username"
                    required
                    th:field="*{username}"
                    type="text"
            />
            <p
                    class="form-errors"
                    id="username-error"
                    role="alert"
                    th:errors="*{username}"
                    th:if="${#fields.hasErrors('username')}">
            </p>
        </div>
        <div class="input-email">
            <label class="visually-hidden" for="email">Mail</label>
            <input
                    aria-describedby="email-error"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Mail"
                    required
                    th:field="*{email}"
                    type="email"
            />
            <p
                    class="form-errors"
                    id="email-error"
                    role="alert"
                    th:errors="*{email}"
                    th:if="${#fields.hasErrors('email')}">
            </p>
        </div>
        <div class="input-password">
            <label class="visually-hidden" for="password">Mot de passe</label>
            <input
                    aria-describedby="password-error"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Mot de passe"
                    required
                    th:field="*{password}"
                    type="password"
            />
            <p
                    class="form-errors"
                    id="password-error"
                    role="alert"
                    th:errors="*{password}"
                    th:if="${#fields.hasErrors('password')}">
            </p>
        </div>
        <button class="signup-button btn btn-primary d-block mx-auto" type="submit">S'inscrire</button>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
