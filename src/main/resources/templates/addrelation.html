<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="fragments/head-common :: common-head('Ajouter une relation')"></th:block>
    <style>
        .form-control {
            width:484px;
            height:54px;
            color:#767676;
        }

        .btn-orange{
            width:151px;
            height:62px;
        }
        .btn-orange:hover{
            background-color:#F48F00;
            color:white;
        }
    </style>
</head>
<body class="d-flex flex-column vh-100">
<div th:replace="fragments/header :: header('addrelation')"></div>
<main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <h1 class="visually-hidden">Ajouter une relation</h1>
    <form method="post" th:action="@{/addrelation}" th:object="${userRelationDto}">
        <div class="d-flex align-items-center gap-3">
            <div class="d-flex flex-column">
                <label class="form-label text-bold" for="email">Chercher une relation</label>
                <input
                        class="form-control text-bold"
                        id="email"
                        name="email"
                        placeholder="Saisir une adresse mail"
                        required
                        th:field="*{email}"
                        type="email"
                />
                <p
                        class="form-errors"
                        th:errors="*{email}"
                        th:if="${#fields.hasErrors('email')}"
                ></p>
            </div>
            <button class="btn btn-orange d-block mx-auto" type="submit">
                Ajouter
            </button>
        </div>
        <div class="mt-3 alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="mt-3 alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
